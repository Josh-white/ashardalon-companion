services:
  ashardalon:
    build: .
    # The test copy sets these in its own .env file (see README); the real game uses the defaults.
    image: ${CONTAINER_NAME:-ashardalon-companion}
    container_name: ${CONTAINER_NAME:-ashardalon-companion}
    ports:
      - "${HOST_PORT:-8081}:3000"
    environment:
      - INSTANCE_LABEL=${INSTANCE_LABEL:-}
      - ART_DIR=/app/art
      # The narrator's voice. The key lives only in the git-ignored .env on the Pi.
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID:-}
      - ELEVENLABS_VOICE_HERALD=${ELEVENLABS_VOICE_HERALD:-}
      - ELEVENLABS_VOICE_DANGER=${ELEVENLABS_VOICE_DANGER:-}
      - ELEVENLABS_VOICE_VILLAIN=${ELEVENLABS_VOICE_VILLAIN:-}
      - ELEVENLABS_VOICE_MEERAK=${ELEVENLABS_VOICE_MEERAK:-}
      - ELEVENLABS_VOICE_MARGRATH=${ELEVENLABS_VOICE_MARGRATH:-}
      - ELEVENLABS_VOICE_KRAASH=${ELEVENLABS_VOICE_KRAASH:-}
      - ELEVENLABS_VOICE_ASHARDALON=${ELEVENLABS_VOICE_ASHARDALON:-}
      - ELEVENLABS_VOICE_BELLAX=${ELEVENLABS_VOICE_BELLAX:-}
      - ELEVENLABS_MODEL=${ELEVENLABS_MODEL:-}
      - ELEVENLABS_VILLAIN_MODEL=${ELEVENLABS_VILLAIN_MODEL:-}
      - ELEVENLABS_STABILITY=${ELEVENLABS_STABILITY:-}
      - ELEVENLABS_STYLE=${ELEVENLABS_STYLE:-}
      - ELEVENLABS_WARM_UP=${ELEVENLABS_WARM_UP:-}
    volumes:
      # The current game is saved here, so it survives restarts and updates.
      - game-data:/data
      # Your own power cards (cards/cards.json) stay on the Pi, outside git.
      - ./cards:/app/cards:ro
      # Recorded sounds can be written, so the #audition page and
      # server/generate-sounds.js can add new ones. Also only on the Pi.
      - ./cards/sounds:/app/cards/sounds
      # Photos of your cards, added from the card art screen. Also only on the Pi.
      - ./cards/art:/app/art
    restart: unless-stopped

volumes:
  game-data:
